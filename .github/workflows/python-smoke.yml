name: Python mobility smoke
on:
  push:
    paths: ["src/**", "tests/**", "pyproject.toml", ".github/workflows/python-smoke.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "pyproject.toml", ".github/workflows/python-smoke.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m agent_movement.demo
      # Signed movement receipts (#11): rerun with the optional Ed25519 extra, then verify fixtures offline.
      - run: python -m pip install -e ".[signing]"
      - run: python -m unittest discover -s tests -v
      - run: python -m agent_movement.receipts verify tests/fixtures/movement-receipts/01-valid-delegation
