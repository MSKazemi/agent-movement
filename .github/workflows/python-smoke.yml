name: Python mobility smoke
on:
  push:
    paths: ["src/**", "tests/**", "tools/**", "pyproject.toml", ".github/workflows/python-smoke.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "tools/**", "pyproject.toml", ".github/workflows/python-smoke.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . "pytest>=9.1"
      # tests/ also holds main's pytest-style corpus tests, which
      # `python -m unittest discover -s tests` cannot import; pytest runs both.
      - run: python -m pytest -q
      - run: python -m agent_movement.demo
      - run: python -m agent_movement.peer_demo
      - run: python -m agent_movement.mobilitybench --output mobilitybench-local.jsonl
      # MobilityBench v0.1 CI smoke subset: digest-verified fixtures, 6 tasks x 1 seed x 6 modes + negatives.
      - run: python tools/mobilitybench_freeze.py --check
      - run: python -m agent_movement.mobilitybench verify --suite v0.1
      - run: python -m agent_movement.mobilitybench run --suite v0.1 --subset smoke --out mobilitybench-v0.1-smoke.jsonl
      - run: python -m agent_movement.mobilitybench report --in mobilitybench-v0.1-smoke.jsonl --out mobilitybench-v0.1-smoke.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobilitybench-local-python-${{ matrix.python-version }}
          path: |
            mobilitybench-local.jsonl
            mobilitybench-v0.1-smoke.jsonl
            mobilitybench-v0.1-smoke.md
          if-no-files-found: ignore
          retention-days: 7
  a2a-adapter:
    # Optional official-SDK A2A v1 adapter (docs/a2a-adapter.md). Core job above stays dependency-free.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[a2a]' "pytest>=9.1"
      - run: python -m pip show a2a-sdk uvicorn starlette sse-starlette httpx protobuf | grep -E '^(Name|Version):'
      - run: python -m pytest -q
      - run: python -m agent_movement.a2a_demo
