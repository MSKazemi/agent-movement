name: Python mobility smoke
on:
  push:
    paths: ["src/**", "tests/**", "pyproject.toml", ".github/workflows/python-smoke.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "pyproject.toml", ".github/workflows/python-smoke.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m agent_movement.demo
      - run: python -m agent_movement.mobilitybench --output mobilitybench-local.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobilitybench-local-python-${{ matrix.python-version }}
          path: mobilitybench-local.jsonl
          if-no-files-found: ignore
          retention-days: 7
