name: Python mobility smoke
on:
  push:
    paths: ["src/**", "tests/**", "tools/**", "pyproject.toml", ".github/workflows/python-smoke.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "tools/**", "pyproject.toml", ".github/workflows/python-smoke.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . "pytest>=9.1"
      # tests/ also holds main's pytest-style corpus tests, which
      # `python -m unittest discover -s tests` cannot import; pytest runs both.
      - run: python -m pytest -q
      - run: python -m agent_movement.demo
      - run: python -m agent_movement.mobilitybench --output mobilitybench-local.jsonl
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobilitybench-local-python-${{ matrix.python-version }}
          path: mobilitybench-local.jsonl
          if-no-files-found: ignore
          retention-days: 7
