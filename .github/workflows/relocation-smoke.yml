name: Checkpoint relocation (optional LangGraph extra)
on:
  push:
    paths: ["src/**", "tests/**", "pyproject.toml", ".github/workflows/relocation-smoke.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "pyproject.toml", ".github/workflows/relocation-smoke.yml"]
jobs:
  relocation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[relocation]'
      - run: python -m unittest tests.test_relocation -v
      - run: python -m agent_movement.relocation_demo --json relocation-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: relocation-results-py${{ matrix.python-version }}
          path: relocation-results.json
