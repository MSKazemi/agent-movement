name: Linux isolated egress experiment

# Evidence is specifically for Linux/x86_64 seccomp and controlled synthetic tasks.
# This is not a production containment, filesystem sandbox or all-path guarantee.
on:
  pull_request:
    paths:
      - "src/agent_movement/egress_*.py"
      - "src/agent_movement/real_adapter_probe.py"
      - "src/agent_movement/continuity_runtime.py"
      - "tests/test_isolated_egress.py"
      - "tests/test_real_adapter_egress.py"
      - "tests/test_continuity_runtime.py"
      - "docs/isolated-egress-lab.md"
      - "docs/real-adapter-egress.md"
      - "docs/isolated-egress-results.json"
      - ".github/workflows/isolated-egress.yml"
  push:
    paths:
      - "src/agent_movement/egress_*.py"
      - "src/agent_movement/continuity_runtime.py"
      - "tests/test_isolated_egress.py"
      - "tests/test_continuity_runtime.py"
      - ".github/workflows/isolated-egress.yml"
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolate:
    name: seccomp syscall boundary and independent peer broker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The actual A2A listener test needs the pinned optional SDK. An unavailable
      # adapter must not be reported as a passing A2A isolation test.
      - run: python -m pip install -e ".[a2a]" "pytest>=9.1"
      - name: Require audited Linux x86_64 syscall ABI
        run: |
          python -c 'from agent_movement.egress_sandbox import supported; assert supported(), "Unsupported ABI: do not silently skip"'
      - name: Attack process cannot bypass kernel network/spawn fence or trusted peer effect route
        run: python -m pytest -q tests/test_isolated_egress.py tests/test_real_adapter_egress.py tests/test_continuity_runtime.py
      - name: Produce reproducible, synthetic-only evidence
        run: |
          python -m agent_movement.egress_experiment --output "$RUNNER_TEMP/isolated-egress-1.json"
          python -m agent_movement.egress_experiment --output "$RUNNER_TEMP/isolated-egress-2.json"
          cmp "$RUNNER_TEMP/isolated-egress-1.json" "$RUNNER_TEMP/isolated-egress-2.json"
          cmp "$RUNNER_TEMP/isolated-egress-1.json" docs/isolated-egress-results.json
          cp "$RUNNER_TEMP/isolated-egress-1.json" isolated-egress-evidence.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: isolated-egress-synthetic-evidence
          path: isolated-egress-evidence.json
          if-no-files-found: ignore
