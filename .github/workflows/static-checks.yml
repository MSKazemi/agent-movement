name: static checks

# ruff (lint) and mypy (strict type check), as `make lint typecheck`: src/agent_movement,
# tools/mobilitybench_freeze.py and tests/test_mobilitybench_v02.py.
# A separate workflow so corpus.yml never needs the optional extras: mypy checks the code
# against the real a2a-sdk, cryptography and langgraph APIs, so this job installs every extra.
on:
  push:
    paths: ["src/**", "tools/mobilitybench_freeze.py", "tests/test_mobilitybench_v02.py", "pyproject.toml", "Makefile",
            ".github/workflows/static-checks.yml"]
  pull_request:
    paths: ["src/**", "tools/mobilitybench_freeze.py", "tests/test_mobilitybench_v02.py", "pyproject.toml", "Makefile",
            ".github/workflows/static-checks.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: ruff and mypy (src/agent_movement)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # `--group` (PEP 735 dependency groups) needs pip >= 25.1.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[a2a,ed25519,hpke,relocation,signing]' --group lint
      - name: Tool versions
        run: python -m ruff --version && python -m mypy --version
      # STATIC_REQUIRED=1: a missing tool or extra fails the job instead of skipping.
      - run: make lint typecheck PYTHON=python STATIC_REQUIRED=1
