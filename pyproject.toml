[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-movement-lab"
version = "0.1.0"
description = "Experimental local task handoff and fencing testbed (not an A2A implementation)"
requires-python = ">=3.10"

[project.optional-dependencies]
# Exact pins (latest stable on PyPI, 2026-10-12): agent_movement.relocation subclasses
# SqliteSaver and relies on its internal cursor() write path. Core stays dependency-free.
relocation = [
    "langgraph==1.2.15",
    "langgraph-checkpoint==4.3.0",
    "langgraph-checkpoint-sqlite==3.1.2",
]

[tool.setuptools.packages.find]
where = ["src"]
