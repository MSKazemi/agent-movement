[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-movement-lab"
version = "0.2.0"
description = "Experimental, synthetic agent-movement testbed: local task handoff, fencing, and optional A2A, peer-auth, checkpoint-relocation and signed-receipt prototypes (research-stage, not production)"
# CPython 3.10 reached end of life on 2026-10-01.
requires-python = ">=3.11"

[project.scripts]
# Unified CLI; each subcommand forwards to an existing `python -m agent_movement.<module>` entry point.
agent-movement = "agent_movement.cli:main"

[project.optional-dependencies]
# Optional A2A v1 adapter (src/agent_movement/a2a_*.py). The core stays dependency-free.
# a2a-sdk is pinned exactly to the release the integration tests were run against.
a2a = [
    "a2a-sdk[http-server]==1.2.2",
    "uvicorn>=0.54",
]
# Optional asymmetric (Ed25519) peer keys; the core and default HS256 mode stay stdlib-only.
ed25519 = ["cryptography>=50.0.2"]
# HPKE-sealed peer delivery (RFC 9180 via cryptography's own HPKE API, present in 50.x);
# latest stable on PyPI when added (2026-10-16). Without it deliveries have no confidentiality.
hpke = ["cryptography>=50.0.2"]
# Exact pins (latest stable on PyPI, 2026-10-12): agent_movement.relocation subclasses
# SqliteSaver and relies on its internal cursor() write path. Core stays dependency-free.
relocation = [
    "langgraph==1.2.15",
    "langgraph-checkpoint==4.3.0",
    "langgraph-checkpoint-sqlite==3.1.2",
]
# Ed25519 for signed movement receipts; latest stable on PyPI when added (2026-10-16).
signing = ["cryptography>=50.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_movement = ["fixtures/mobilitybench-v0.1/*", "fixtures/mobilitybench-v0.2/*", "fixtures/mobilitybench-local-smoke/*"]

# The corpus tools in tools/ and the agent_movement core in src/ are stdlib-only;
# the optional extras above add third-party packages. pytest is needed only to run tests/.

[dependency-groups]
dev = ["pytest>=9.1"]
# Static checks (`make lint typecheck`); exact pins at the latest stable releases on PyPI
# (2026-10-16): ruff 0.17.1, mypy 2.4.0. types-protobuf is the only stub package the extras
# need (a2a-sdk exposes google.protobuf); a2a-sdk, langgraph and cryptography ship their own
# inline types. Install with `pip install --group lint` (pip >= 25.1).
lint = [
    "ruff==0.17.1",
    "mypy==2.4.0",
    "types-protobuf==7.35.1.20260906",
]

# ruff: lint only (no formatter gate). `make lint` checks src/agent_movement plus the
# MobilityBench freeze tool and the v0.2 tests (STATIC_PATHS in the Makefile).
[tool.ruff]
target-version = "py311"
# The package is written to a 120-column limit; only four lines exceeded it.
line-length = 120
src = ["src", "tools"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "B",        # flake8-bugbear
    "I",        # isort
    "UP",       # pyupgrade (py311)
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
    "C4",       # comprehensions
    "PIE",      # misc. lints
    "PERF",     # perflint
    "PL",       # pylint (subset, see ignores)
    "S",        # flake8-bandit (security)
    "BLE",      # blind except
    "ISC",      # implicit string concatenation
    "DTZ",      # naive datetimes
    "LOG", "G", # logging
]
ignore = [
    # Optional extras (a2a-sdk, cryptography, langgraph) are imported lazily inside the
    # function that needs them so the stdlib-only core imports without them.
    "PLC0415",
    # Size/complexity heuristics. The demos and verifiers are deliberately linear,
    # step-by-step scripts; splitting them, or regrouping keyword arguments of public
    # functions, would change APIs or obscure the protocol steps without fixing a defect.
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
    # Protocol constants (exit codes, HTTP statuses, field counts) read clearer inline.
    "PLR2004",
    # Every assert narrows an Optional for the type checker (Popen pipes opened with PIPE,
    # the worker of the read-only inspection graph); no check relies on one.
    "S101",
    # Informational only: every subprocess call passes an argv list starting with
    # sys.executable and never a shell (S602/S604/S605 stay enabled).
    "S603",
]

[tool.ruff.lint.per-file-ignores]
# SQLite cannot bind identifiers, so these modules interpolate column lists, table names
# and authority-schema names into SQL. Every interpolated identifier is a module constant
# or is checked against an allowlist first (`_authority_schema`, PURGEABLE); values are
# always bound with `?` placeholders.
"src/agent_movement/{a2a_profile,core,peer,peer_demo,relocation,retention}.py" = ["S608"]
# The MobilityBench report text deliberately uses typographic characters ("–" ranges,
# "×" products). Reports are byte-compared against committed results, so they stay.
"src/agent_movement/mobilitybench_v01.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["agent_movement"]

# mypy: strict, no per-module relaxations (a2a-sdk, cryptography and langgraph ship inline types).
[tool.mypy]
python_version = "3.11"
files = ["src/agent_movement", "tools/mobilitybench_freeze.py", "tests/test_mobilitybench_v02.py"]
strict = true
warn_unreachable = true
# The other tools/ scripts and tests/ are not type-checked yet.
mypy_path = ["src", "tools"]
explicit_package_bases = true

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
# tools/ for the corpus scripts; src/ so agent_movement imports without an install
# (the corpus CI job installs only pytest).
pythonpath = ["tools", "src"]
addopts = ["-ra", "--strict-markers", "-p", "no:cacheprovider"]
xfail_strict = true
